  h('button',{class:'sm',onclick:()=>{F={line:'',dir:'',status:'',hours:'',station:'',dev:d.k.slice(0,12)};saveF();modBox=null;tab='mod';close();document.querySelectorAll('header [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t=='mod'));show()}},'Show its sightings'));
 const out=[head,full,st,h('div',{class:'row'},A)];
 if(d.kind=='device'){
  out.push(h('div',{class:'grid'},kpi('First seen',tm(d.first_seen),'sm'),kpi('Reports 30 d',d.total30),kpi('Hidden by riders',d.hidden30,d.hidden30?'w':''),kpi('👍 received',d.ups),kpi('👎 received',d.downs,d.downs>d.ups?'w':''),kpi('👍 given 30 d',d.vote_up),kpi('👎 given 30 d',d.vote_down,d.vote_down>=8&&d.vote_down>=3*Math.max(1,d.vote_up)?'w':''),kpi('Networks 7 d',d.networks)),
   h('h2',null,'Lines used (30 d)'),h('div',{class:'row'},d.lines.map(l=>h('span',null,lineBadge(l.line,LC[l.line]),' ×'+l.n,'  '))),
   h('h2',null,'Top stations (30 d)'),h('div',{class:'row'},d.stations.map(x=>h('span',{class:'fl'},x.name+' ×'+x.n))),
   h('h2',null,'Latest sightings'),tbl(['When','Line','Station','Dir','👍','👎',''],d.recent.map(r=>h('tr',null,h('td',{title:tm(r.seen_at)},ago(r.seen_at)),h('td',null,lineBadge(r.line,LC[r.line])),h('td',null,r.station),h('td',null,dirT(r.dir)),h('td',null,r.up),h('td',null,r.down),
    h('td',null,r.hidden&&h('span',{class:'fl a'},'hidden'),' ',h('button',{class:'sm dg',onclick:async()=>{if(confirm('Delete this sighting?')){const x=await act('del_sighting',{id:r.id,note:'profile'});if(x){close();drawer(d.k)}}}},'Delete'))))))}
 else if(d.kind=='network')out.push(h('p',{class:'mu'},'Mobile carriers put many riders behind one address. Look at the devices before banning the network.'),

// ===== v0.36 Suspects: one ranked list (score + reasons), client-side filters, reviewed list =====
const WHY={rejected:'riders hid some of its sightings',downvoted:'its sightings got many 👎 and few 👍',busy:'15+ reports in 24 h',hopper:'3+ different lines within one hour',repeat:'5+ reports at one station and direction, none confirmed',downvoter:'casts many 👎 and almost no 👍'};
let SD=7,SF={why:new Set(),min:0,hideBan:true,hideRev:true,hidePaused:false,dev:''},susData=null,susBox=null;
function buildSus(){
 const root=h('div'),res=h('div'),net=h('div');
 const rep=()=>paint();
 const win=h('select',{'aria-label':'Window',onchange:async e=>{SD=+e.target.value;try{susData=await get('suspects?days='+SD);paint()}catch{toast('Error loading',1)}}},[[1,'Last 24 h'],[7,'Last 7 days'],[30,'Last 30 days']].map(([v,l])=>h('option',{value:v,selected:v===SD},l)));
 const min=h('select',{'aria-label':'Minimum score',onchange:e=>{SF.min=+e.target.value;rep()}},[[0,'Any score'],[4,'Score 4+'],[8,'Score 8+'],[15,'Score 15+']].map(([v,l])=>h('option',{value:v},l)));
 const chips=Object.keys(WHY).map(k=>h('button',{class:'tg '+k,title:WHY[k],'data-k':k,onclick:e=>{SF.why.has(k)?SF.why.delete(k):SF.why.add(k);rep()}},k));
 const cb=(lab,key)=>h('label',{class:'cb'},h('input',{type:'checkbox',checked:SF[key],onchange:e=>{SF[key]=e.target.checked;rep()}}),lab);
 const q=h('input',{placeholder:'Device prefix',style:'width:9rem','aria-label':'Device prefix',oninput:e=>{SF.dev=e.target.value.trim();rep()}});
 const legend=h('details',{class:'box'},h('summary',null,'How the score works'),h('ul',null,Object.entries(WHY).map(([k,v])=>h('li',null,h('span',{class:'tg '+k},k),' ',v)),h('li',null,'Score adds up: rejected 5 per hidden sighting (max 25), downvoted 3, busy 2+, hopper 6, repeat 4, downvoter 4. A network shared by 5+ devices is shown as a note, not scored.'),h('li',null,'"Mark OK" hides a device until riders hide another of its sightings.')));
 function paint(){
  chips.forEach(c=>c.classList.toggle('on',SF.why.has(c.dataset.k)));
  const all=susData.devices,f=all.filter(r=>(SF.min<=r.score)&&(!SF.why.size||r.reasons.some(x=>SF.why.has(x)))&&!(SF.hideBan&&r.banned)&&!(SF.hideRev&&r.reviewed)&&!(SF.hidePaused&&r.paused)&&(!SF.dev||r.dev.startsWith(SF.dev)));
  res.replaceChildren(h('p',{class:'mu'},f.length+' of '+all.length+' scored devices shown'+(all.length>=80?' (top 80)':'')),
   tbl(['Score','Device','Why','Reports','Hidden','👍/👎 got','👎 given','Lines','Last','Status',''],f.map(r=>h('tr',null,
    h('td',null,h('span',{class:'sc '+(r.score>=10?'s3':r.score>=5?'s2':'s1')},r.score)),h('td',null,devBtn(r.dev)),
    h('td',null,r.reasons.map(x=>h('span',{class:'tg on '+x,title:WHY[x]},x))),
    h('td',{title:'total in window / last 24 h'},r.total+' / '+r.r24),h('td',null,r.hidden),h('td',null,r.ups+' / '+r.downs),h('td',null,r.vdown),h('td',null,r.lines),h('td',null,r.last_at?ago(r.last_at)+' ago':'—'),
    h('td',null,r.paused&&h('span',{class:'fl a'},'paused'),r.banned&&h('span',{class:'fl r'},'banned'),r.reviewed&&h('span',{class:'fl'},'OK'),r.net_devs>=5&&h('span',{class:'fl',title:r.net_devs+' devices share its network'},'shared net')),
    h('td',null,h('button',{class:'sm',onclick:()=>drawer(r.dev)},'Profile'),' ',
     r.reviewed?h('button',{class:'sm',onclick:()=>act('unok',{k:r.dev,note:'suspects'})},'Unmark'):h('button',{class:'sm',onclick:()=>act('ok',{k:r.dev,note:'suspects'})},'OK'),' ',
     !r.banned&&h('button',{class:'sm dg',onclick:()=>act('ban',{k:r.dev,note:'suspects'},'Ban this device?')},'Ban'))))));
  net.replaceChildren(h('h2',null,'Many devices behind one network (24 h)'),h('p',{class:'mu'},'Mobile carriers share one address between many riders. Do NOT ban these unless you are sure.'),
   tbl(['Network','Devices','Reports',''],susData.shared_ips.map(r=>h('tr',null,h('td',null,devBtn(r.ip)),h('td',null,r.devices),h('td',null,r.reports),h('td',null,r.banned&&h('span',{class:'fl r'},'banned'))))))}
 root.append(h('p',{class:'mu'},'Devices are paused automatically when riders keep rejecting them (3 hidden in 24 h or 6 in 7 d). Review here, ban only when it is clearly abuse.'),
  h('div',{class:'bar'},h('div',{class:'row'},win,min,q,cb('Hide banned','hideBan'),cb('Hide reviewed (OK)','hideRev'),cb('Hide paused','hidePaused')),h('div',{class:'row'},chips)),legend,res,net);
 return{root,paint}}
async function sus(){susData=await get('suspects?days='+SD);if(!susBox)susBox=buildSus();susBox.paint();return susBox.root}

async function ban(){const b=await get('banned');return h('div',null,h('h2',null,'Banned devices / networks'),tbl(['Key','Last seen','Reports 30 d',''],b.map(r=>h('tr',null,h('td',null,copy(r.k)),h('td',null,r.last_seen?ago(r.last_seen)+' ago':'never'),h('td',null,r.reports30),h('td',null,h('button',{class:'sm',onclick:()=>act('unban',{k:r.k,note:'unban'},'Unban?')},'Unban'))))))}
async function logv(){const l=await get('log');return h('div',null,h('h2',null,'Moderation log (latest 80)'),tbl(['When','Action','Target','Note'],l.map(r=>h('tr',null,h('td',null,tm(r.at)),h('td',null,r.act),h('td',null,copy(r.target)),h('td',null,r.note)))))}

(async()=>{const r=await fetch('/api/admin/ping',{headers:{'x-mh-admin':'1'},credentials:'same-origin',cache:'no-store'});r.status==200?start():lock()})();
