<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>MitroHelper admin</title>
<style>
:root{--bg:#0f1512;--cd:#17201b;--ln:#26332b;--tx:#e8f0ea;--mu:#8fa398;--ac:#34d399;--rd:#f87171;--am:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.6rem 1rem;background:#0f1512ee;border-bottom:1px solid var(--ln)}
header b{margin-inline-end:auto}main{max-width:1100px;margin:0 auto;padding:1rem}
button,select,input{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:.45rem .8rem}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#06210f;border-color:var(--ac)}
button.dg{color:var(--rd)}button.dg:hover{border-color:var(--rd)}button.sm{padding:.2rem .5rem;font-size:.8rem}
.login{max-width:340px;margin:12vh auto;display:grid;gap:.7rem}.login h1{margin:0 0 .3rem}
.err{color:var(--rd);min-height:1.3em}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem}
.k{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:.7rem .9rem}.k small{color:var(--mu);display:block}.k b{font-size:1.6rem}
.k.w b{color:var(--am)}.k.r b{color:var(--rd)}
h2{font-size:1.05rem;margin:1.4rem 0 .5rem;color:var(--mu);font-weight:600}
.box{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:.8rem;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:start;padding:.35rem .5rem;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:600}
.ln{display:inline-block;min-width:1.5rem;text-align:center;border-radius:6px;padding:0 .3rem;color:#fff;font-weight:800}
.fl{display:inline-block;border-radius:6px;padding:0 .4rem;margin-inline-end:.2rem;font-size:.75rem;border:1px solid var(--ln)}.fl.r{color:var(--rd);border-color:var(--rd)}.fl.a{color:var(--am);border-color:var(--am)}
code{color:var(--mu);cursor:pointer}.mu{color:var(--mu)}.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.6rem}.hide{display:none}
.toast{position:fixed;bottom:1rem;inset-inline:1rem;margin:auto;max-width:360px;background:var(--ac);color:#06210f;border-radius:10px;padding:.6rem 1rem;text-align:center;font-weight:700}.toast.e{background:var(--rd);color:#fff}
</style></head><body>
<div id="app"></div>
<script nonce="__NONCE__">
'use strict';
const $=s=>document.querySelector(s),app=$('#app');
const h=(t,a,...c)=>{const e=document.createElement(t);for(const k in a||{}){if(k=='class')e.className=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else if(a[k]===false||a[k]==null){}else e.setAttribute(k,a[k]===true?'':a[k])}for(const x of c.flat())if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(String(x)));return e};
const NS='http://www.w3.org/2000/svg',sv=(t,a,...c)=>{const e=document.createElementNS(NS,t);for(const k in a||{})e.setAttribute(k,a[k]);c.flat().forEach(x=>e.append(x));return e};
async function api(path,body){const r=await fetch('/api/admin/'+path,{method:body?'POST':'GET',headers:{'x-mh-admin':'1','content-type':'application/json'},body:body?JSON.stringify(body):undefined,credentials:'same-origin',cache:'no-store'});
 let j={};try{j=await r.json()}catch{}if(r.status==401&&path!='login'){lock();throw new Error('auth')}return{s:r.status,j}}
function toast(m,e){const t=h('div',{class:'toast'+(e?' e':'')},m);document.body.append(t);setTimeout(()=>t.remove(),2600)}
const ago=d=>{if(!d)return'—';const m=Math.round((Date.now()-new Date(d))/6e4);return m<1?'now':m<60?m+' min':m<2880?Math.round(m/60)+' h':Math.round(m/1440)+' d'};
const tm=d=>new Date(d).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const sh=k=>k?k.slice(0,8)+'…':'';
const copy=k=>h('code',{title:k+' (click to copy)',onclick:()=>navigator.clipboard&&navigator.clipboard.writeText(k).then(()=>toast('Copied'))},sh(k));
const LC={};let tab='ov',timer,idle=Date.now();
['click','keydown','touchstart'].forEach(e=>addEventListener(e,()=>idle=Date.now(),{passive:true}));

function lock(msg){clearInterval(timer);app.replaceChildren(loginView(msg))}
function loginView(msg){const pw=h('input',{type:'password',placeholder:'Password',autocomplete:'current-password'}),otp=h('input',{inputmode:'numeric',maxlength:'6',placeholder:'6-digit code',autocomplete:'one-time-code'}),er=h('div',{class:'err'},msg||'');
 const go=async()=>{er.textContent='';const r=await api('login',{pw:pw.value,otp:otp.value});pw.value=otp.value='';
  if(r.j.r=='ok')start();else er.textContent=r.s==429?'Too many attempts. Try again in 15 minutes.':'Login failed.'};
 otp.addEventListener('keydown',e=>{if(e.key=='Enter')go()});pw.addEventListener('keydown',e=>{if(e.key=='Enter')otp.focus()});
 return h('div',{class:'login'},h('h1',null,'MitroHelper admin'),pw,otp,h('button',{class:'on',onclick:go},'Sign in'),er)}

async function start(){app.replaceChildren(shell());await show();timer=setInterval(()=>{if(document.hidden)return;if(Date.now()-idle>25*6e4)return;if(tab=='ov')show(true)},6e4)}
function shell(){const t=(id,l)=>h('button',{'data-t':id,class:id==tab?'on':'',onclick:()=>{tab=id;document.querySelectorAll('header [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==id));show()}},l);
 return h('div',null,h('header',null,h('b',null,'MitroHelper admin'),t('ov','Overview'),t('mod','Moderate'),t('sus','Suspects'),t('ban','Banned'),t('log','Log'),
  h('button',{onclick:()=>show()},'Refresh'),h('button',{onclick:async()=>{await api('logout',{});lock('Signed out.')}},'Sign out')),h('main',{id:'m'}))}

async function show(quiet){const m=$('#m');if(!m)return;try{const f={ov:ov,mod:mod,sus:sus,ban:ban,log:logv}[tab];const el=await f();m.replaceChildren(el)}catch(e){if(e.message!='auth'&&!quiet)toast('Error loading',1)}}
const get=async p=>{const r=await api(p);if(r.s!=200)throw new Error('http');return r.j};
async function act(a,o,msg){if(msg&&!confirm(msg))return;const r=await api('act',{a,...o});toast(r.j.r=='ok'?'Done':r.j.r=='nf'?'Not found (already gone)':'Failed',r.j.r!='ok'&&r.j.r!='nf');show()}
const kpi=(l,v,c)=>h('div',{class:'k '+(c||'')},h('small',null,l),h('b',null,v??0));
const lineBadge=(l,c)=>h('span',{class:'ln',style:'background:'+(/^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#555')},l);
const tbl=(heads,rows)=>h('div',{class:'box'},h('table',null,h('tr',null,heads.map(x=>h('th',null,x))),rows.length?rows:h('tr',null,h('td',{class:'mu'},'Nothing here'))));

function bars(data,key,key2,w=640,hgt=140){const mx=Math.max(1,...data.map(d=>Math.max(d[key],key2?d[key2]:0))),bw=w/data.length,s=sv('svg',{viewBox:`0 0 ${w} ${hgt+18}`,width:'100%',role:'img'});
 data.forEach((d,i)=>{const x=i*bw,a=d[key]/mx*hgt,b=key2?d[key2]/mx*hgt:0,n=key2?2:1;
  s.append(sv('rect',{x:x+bw*.12,y:hgt-a,width:bw*.76/n,height:a,fill:'#34d399',rx:2},sv('title',null,document.createTextNode((d.d||d.h+'h')+': '+d[key]))));
  if(key2)s.append(sv('rect',{x:x+bw*.12+bw*.38,y:hgt-b,width:bw*.38,height:b,fill:'#60a5fa',rx:2},sv('title',null,document.createTextNode((d.d||'')+': '+d[key2]))));
  const lab=d.d?d.d.slice(8):String(d.h);if(data.length<=14||i%3==0){const t=sv('text',{x:x+bw/2,y:hgt+13,'text-anchor':'middle','font-size':10,fill:'#8fa398'});t.append(document.createTextNode(lab));s.append(t)}});return s}

async function ov(){const s=await get('stats');s.lines.forEach(l=>LC[l.line]=l.color);
 return h('div',null,
  h('div',{class:'grid'},kpi('Live now (45 min)',s.live45),kpi('Reports 24 h',s.rep24),kpi('Reports 7 d',s.rep7),kpi('Reports 30 d',s.rep30),kpi('Reports all time',s.repAll),
   kpi('Reporters 24 h',s.dev24),kpi('Reporters 7 d',s.dev7),kpi('Visitors today',s.vis_today),kpi('Visitors 7 d',s.vis7),kpi('New today',s.new_today),kpi('Installed app today',s.app_today),
   kpi('Confirms 24 h',s.conf24),kpi('Rejects 24 h',s.rej24,s.rej24>s.conf24?'w':''),kpi('Hidden by votes 7 d',s.hidden7,s.hidden7?'w':''),kpi('Auto-paused devices',s.blocked,s.blocked?'w':''),kpi('Banned',s.banned),kpi('Stop alerts live',s.inc_live,s.inc_live?'r':''),kpi('Stop alerts 7 d',s.inc7)),
  h('h2',null,'Last 14 days: reports (green) vs visitors (blue)'),h('div',{class:'box'},bars(s.daily,'rep','vis')),
  h('h2',null,'Reports by hour of day, Tunis time (last 14 days)'),h('div',{class:'box'},bars(s.hourly,'n')),
  h('h2',null,'Lines'),tbl(['Line','24 h','7 d','Last sighting'],s.lines.map(l=>h('tr',null,h('td',null,lineBadge(l.line,l.color)),h('td',null,l.r24),h('td',null,l.r7),h('td',{class:!l.last||Date.now()-new Date(l.last)>216e5?'mu':''},l.last?ago(l.last)+' ago':'never')))),
  h('h2',null,'Top stations (7 d)'),tbl(['Line','Station','Reports'],s.stations.map(x=>h('tr',null,h('td',null,lineBadge(x.line,LC[x.line])),h('td',null,x.name),h('td',null,x.n)))),
  h('h2',null,'Where visitors come from (30 d, ?src= tag)'),tbl(['Source','Devices','Came back'],s.src.map(x=>h('tr',null,h('td',null,x.src),h('td',null,x.devices),h('td',null,x.came_back)))),
  h('p',{class:'mu'},'Updated '+tm(s.now)+' · auto-refreshes every minute while this tab is open and you are active.'))}

let lineF='';
async function mod(){const [rc,ic]=await Promise.all([get('recent'+(lineF?'?line='+encodeURIComponent(lineF):'')),get('incidents')]);
 const flags=r=>[r.hidden&&h('span',{class:'fl a'},'hidden'),r.paused&&h('span',{class:'fl a'},'paused'),r.banned&&h('span',{class:'fl r'},'banned')];
 const sel=h('select',{onchange:e=>{lineF=e.target.value;show()}},h('option',{value:''},'All lines'),['1','2','3','4','5','6','TGM'].map(l=>h('option',{value:l,selected:l==lineF},'Line '+l)));
 return h('div',null,h('div',{class:'row'},sel,h('span',{class:'mu'},'Deleting a sighting removes it for everybody immediately. Ban stops that device from posting.')),
  h('h2',null,'Latest sightings'),tbl(['When','Line','Station','Dir','👍','👎','Flags','Device',''],rc.map(r=>h('tr',null,h('td',{title:tm(r.seen_at)},ago(r.seen_at)),h('td',null,lineBadge(r.line,LC[r.line])),h('td',null,r.station),h('td',null,r.dir=='a'?'→ last':'→ first'),h('td',null,r.up),h('td',null,r.down),h('td',null,flags(r)),h('td',null,copy(r.dev)),
    h('td',null,h('button',{class:'sm dg',onclick:()=>act('del_sighting',{id:r.id,note:'sighting'},'Delete this sighting?')},'Delete'),' ',
     !r.banned&&h('button',{class:'sm dg',onclick:()=>act('ban',{k:r.dev,note:'from sighting '+r.id},'Ban this device?')},'Ban device'),' ',
     h('button',{class:'sm',onclick:()=>act('purge_dev',{k:r.dev,note:'purge'},'Delete ALL sightings and stop alerts of this device from the last 7 days?')},'Purge'))))),
  h('h2',null,'Stop alerts (48 h)'),tbl(['When','Line','Station','Stopped','Running','Live','Device',''],ic.map(r=>h('tr',null,h('td',null,ago(r.seen_at)),h('td',null,lineBadge(r.line,LC[r.line])),h('td',null,r.station),h('td',null,r.up),h('td',null,r.down),h('td',null,r.live&&h('span',{class:'fl r'},'live')),h('td',null,copy(r.dev)),
    h('td',null,h('button',{class:'sm dg',onclick:()=>act('del_incident',{id:r.id,note:'alert'},'Delete this stop alert?')},'Delete'),' ',!r.banned&&h('button',{class:'sm dg',onclick:()=>act('ban',{k:r.dev,note:'from alert '+r.id},'Ban this device?')},'Ban device'))))))}

async function sus(){const s=await get('suspects');const bb=(k,w)=>h('button',{class:'sm dg',onclick:()=>act('ban',{k,note:'suspects'},w||'Ban this?')},'Ban');
 return h('div',null,h('p',{class:'mu'},'Devices are paused automatically when riders keep rejecting them (3 hidden in 24 h or 6 in 7 d). Review here, ban only when it is clearly abuse.'),
  h('h2',null,'Often rejected by riders (7 d)'),tbl(['Device','Hidden','Total','Last','Status',''],s.rejected.map(r=>h('tr',null,h('td',null,copy(r.dev)),h('td',null,r.hidden),h('td',null,r.total),h('td',null,ago(r.last_seen)+' ago'),h('td',null,r.paused&&h('span',{class:'fl a'},'paused'),r.banned&&h('span',{class:'fl r'},'banned')),h('td',null,!r.banned&&bb(r.dev))))),
  h('h2',null,'Very active (15+ reports in 24 h)'),tbl(['Device','Reports','First','Last',''],s.busy.map(r=>h('tr',null,h('td',null,copy(r.dev)),h('td',null,r.reports),h('td',null,tm(r.first_at)),h('td',null,tm(r.last_at)),h('td',null,!r.banned&&bb(r.dev))))),
  h('h2',null,'3+ different lines in one hour'),tbl(['Device','Hour','Lines','Reports',''],s.hoppers.map(r=>h('tr',null,h('td',null,copy(r.dev)),h('td',null,tm(r.hr)),h('td',null,r.line_count),h('td',null,r.reports),h('td',null,bb(r.dev))))),
  h('h2',null,'Many devices behind one network (24 h)'),h('p',{class:'mu'},'Mobile carriers share one address between many riders. Do NOT ban these unless you are sure.'),
  tbl(['Network hash','Devices','Reports',''],s.shared_ips.map(r=>h('tr',null,h('td',null,copy(r.ip)),h('td',null,r.devices),h('td',null,r.reports),h('td',null,!r.banned&&bb(r.ip,'Ban a whole network? This can block many innocent riders.'))))))}

async function ban(){const b=await get('banned');return h('div',null,h('h2',null,'Banned devices / networks'),tbl(['Key','Last seen','Reports 30 d',''],b.map(r=>h('tr',null,h('td',null,copy(r.k)),h('td',null,r.last_seen?ago(r.last_seen)+' ago':'never'),h('td',null,r.reports30),h('td',null,h('button',{class:'sm',onclick:()=>act('unban',{k:r.k,note:'unban'},'Unban?')},'Unban'))))))}
async function logv(){const l=await get('log');return h('div',null,h('h2',null,'Moderation log (latest 80)'),tbl(['When','Action','Target','Note'],l.map(r=>h('tr',null,h('td',null,tm(r.at)),h('td',null,r.act),h('td',null,copy(r.target)),h('td',null,r.note)))))}

(async()=>{const r=await fetch('/api/admin/ping',{headers:{'x-mh-admin':'1'},credentials:'same-origin',cache:'no-store'});r.status==200?start():lock()})();
</script></body></html>
